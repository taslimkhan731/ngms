<ion-header>
    <ion-toolbar style="background-color: darkgreen;color: white;letter-spacing: 2px;font-size: 10px !important">
      <ion-buttons slot="start">
        <ion-icon name="chevron-back-outline" (click)="goBack()"></ion-icon>
      </ion-buttons>
      <ion-title style="text-transform: capitalize;">Select Driver</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>
  <div class="containerr">
    <ion-card>
      <ion-card-content style="padding-top: 16px !important;">
        <!-- <ion-row style="padding-left: 6px;">
          <ion-col size="4" *ngFor="let data of driverList">
            <div>
              <img src="../../../../../../../assets/afterlogin/icons8-driver-96.png" alt=""><br>
              <ion-button (click)="view(data)" class="driver-btn"><ion-icon name="eye-outline"></ion-icon></ion-button><ion-button (click)="addDriver(data)" class="driver-btn">ADD</ion-button>
            </div>
          </ion-col>
        </ion-row> -->
        <div style="overflow-x:auto;">
          <table style="width: 100%;">
            <thead class="thead text-center text-nowrap">
              <tr>
                <th>Action</th>
                <th>Driver Id </th>
                <th>Driver Name </th>
                <th>Driver Mobile Number </th>
                <th>Protocol Name</th>
                <th>Protocol Mobile Number</th>
                <th>Vehicle Number</th>
                <th>Vehicle Description</th>
              </tr>
            </thead>
            <tbody class="tbody text-center text-nowrap">
              <tr *ngFor="let data of driverList">
                <td>
                  <ion-icon name="add-outline" class="add" (click)="addDriver(data)"></ion-icon>
                </td>
                <td>{{data.driverId}}</td>
                <td>{{data.driverName}}</td>
                <td>{{data.driverMobileNo}}</td>
                <td>{{data.protocolName}}</td>
                <td>{{data.protocolMobile}}</td>
                <td>{{data.vehicleNo}}</td>
                <td>{{data.vehicledesc}}</td>

              </tr>
            </tbody>
          </table>
        </div>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
