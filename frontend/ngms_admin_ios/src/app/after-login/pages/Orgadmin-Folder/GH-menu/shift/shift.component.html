<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title class="logo-text">Shift</ion-title>
    <ion-button slot="end" id="filtermodal-modal" (click)="openFilterModal()">
      <ion-icon name="filter-outline"></ion-icon>&nbsp;Filter
    </ion-button>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="filterHandleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div>
    <ion-item class="mt-1" style="border: 2px solid green;margin: 0px 9px 0 10px;border-radius: 6px;">
      <ion-select interface="action-sheet" placeholder="Select City" [(ngModel)]="selectCity"
        (ionChange)="getGuestHouseList($event)" [interfaceOptions]="{'cssClass': 'mycomponent-wider-popover'}">
        <ion-select-option [value]=item.cityId *ngFor="let item of getAllCityList">{{item.cityName}}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item class="mt-1" style="border: 2px solid green;margin: 0px 9px 0 10px;border-radius: 6px;">
      <ion-select interface="action-sheet" placeholder="Select Guest House" [(ngModel)]="selectGH"
        (ionChange)="getBhawanName($event)" [interfaceOptions]="{'cssClass': 'mycomponent-wider-popover'}">
        <ion-select-option [value]=item.id *ngFor="let item of guestHouseList">{{item.name}}</ion-select-option>
      </ion-select>
    </ion-item>
  </div>
  <div class="cardHeight">
    <ion-card *ngFor="let item of guestHouseShiftDetails" class="mt-1">
      <ion-card-header>
        <ion-card-title>{{item.cityName}},{{item.blockName}}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-row>
          <ion-col size="6">
            <ion-label class="label-key">Created By</ion-label><br />
            <ion-label class="label-value">{{item.userId}}</ion-label>
          </ion-col>
          <ion-col size="6">
            <ion-label class="label-key">Shift Open time</ion-label><br />
            <ion-label class="label-value">{{item.createdTime}}</ion-label>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="6">
            <ion-label class="label-key">Status</ion-label><br />
            <ion-label class="label-value">{{item.status}}</ion-label>
          </ion-col>
          <ion-col size="6">
            <ion-label class="label-value">
              <ion-button (click)="closeShift(item.shiftId)"
                [ngStyle]="{'color':'#E91E34','--background':'#FFE2E5','--background-activated':'#FFE2E5','font-size':'83%','font-weight':'600', 'width': '-webkit-fill-available'}">
                Close
              </ion-button>
            </ion-label>
          </ion-col>
        </ion-row>
      </ion-card-content>
    </ion-card>
  </div>
  <ion-modal #filtermodal trigger="filtermodal-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">
              <ion-icon style="color: #ffffff;" name="arrow-back"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-title>Search</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="filterForm" (ngSubmit)="submitFilterForm(filterForm.value)">

          <div style="margin-top: 5px;">
            <div style="position: relative; left: 13px; font-size: 18px;">Created Date</div>
            <ion-item class="mt-1" style="border: 2px solid green;margin: 0px 9px 0 10px;border-radius: 6px;">
              <ion-input type="date" formControlName="createdDate"></ion-input>
            </ion-item>
          </div>

          <div style="margin-top: 5px;">
            <div style="position: relative; left: 13px; font-size: 18px;">Created By</div>
            <ion-item class="mt-1" style="border: 2px solid green;margin: 0px 9px 0 10px;border-radius: 6px;">
              <ion-input type="text" placeholder="Guest Name" formControlName="createdBy"></ion-input>
            </ion-item>
          </div>
          <ion-button type="submit" expand="block" style="margin: 20px 0px 0px 6px !important;
          width: 96% !important; --background: green !important;--background-activated: green !important;">Submit</ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
