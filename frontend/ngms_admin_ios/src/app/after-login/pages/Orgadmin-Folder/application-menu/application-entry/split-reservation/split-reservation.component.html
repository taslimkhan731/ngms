<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-buttons>
    <ion-title class="logo-text">Split Reservation</ion-title>
    <ion-button slot="end" id="filtermodal-modal" (click)="openFilterModal()">
      <ion-icon name="filter-outline"></ion-icon>&nbsp;Filter
    </ion-button>
  </ion-toolbar>
</ion-header>
<ion-content [scrollEvents]="true" (ionScroll)="getScrollPos($event)">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div class="content">

    <div class="cardHeight">
      <ion-card *ngFor="let data of splitViewData " class="mt-1">
        <!-- <ion-card-header>
          <ion-card-title>Guest Details</ion-card-title>
        </ion-card-header> -->
        <ion-card-content style="padding:0px 0px !important">
          <ion-grid>
            <ion-row style="padding-left: 6px;">
              <ion-col size="6">
                <ion-label class="label-key">Booking ID</ion-label><br>
              </ion-col>
              <ion-col size="6">
                <ion-label class="label-value">{{data.bookingId}}</ion-label>
              </ion-col>
              <ion-col size="6">
                <ion-label class="label-key">From date</ion-label><br>
              </ion-col>
              <ion-col size="6">
                <ion-label class="label-value">{{data.frmDt}}</ion-label>
              </ion-col>
              <ion-col size="6">
                <ion-label class="label-key">To date</ion-label><br>
              </ion-col>
              <ion-col size="6">
                <ion-label class="label-value">{{data.toDt}}</ion-label>
              </ion-col>
            </ion-row>
          </ion-grid>
          <ion-label class="user_Name" style="margin:5%; color:green;">Guest Details</ion-label>
          <div class="guestCls">
            <!-- <ion-label class="user_Name">Guest Details</ion-label> -->

            <ion-row style="padding-left:5px !important" *ngFor="let item of data.list">
              <ion-col size="7">
                <ion-label class="label-value">{{item.guestName}}</ion-label><br>
              </ion-col>

              <ion-col size="5" class="text-center ion-align-self-center">
                <ion-checkbox (ionChange)="selectGuest(item.guestId,data.bookingId,$event)"></ion-checkbox>
              </ion-col>
            </ion-row>
          </div>
          <div>
            <ion-grid style="margin-left:2%;margin-right:2%">
              <ion-row>
                <ion-col size="12">
                  <ion-button
                    [ngStyle]="{'color':'#0078FF','--background':'#E1EDFF','--background-activated':'#E1EDFF','font-size':'83%','font-weight':'600', 'width': '-webkit-fill-available'}"
                    (click)="splitGuest(data.bookingId)">
                    Split
                  </ion-button>
                </ion-col>
              </ion-row>
            </ion-grid>
            <!-- <ion-button
              [ngStyle]="{'color':'rgb(255 255 255)','--background':'#245eb4','font-size':'72%','width':'23%'}"
              (click)="splitGuest(data.bookingId)"><ion-icon style="transform: rotate(-90deg);"
                name="cut-outline"></ion-icon>Split</ion-button> -->
          </div>
        </ion-card-content>
      </ion-card>
      <div class="back-to-top-btn" *ngIf="backToTop" (click)="gotToTop()">
        <ion-icon name="chevron-up-outline"></ion-icon>
      </div>
      <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)" [threshold]="250">
        <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
      <ng-container *ngIf="splitViewData.length == 0">
        <div class="img-wrapper">
          <img class="noDataAvail" src="../../../../../../../assets/afterlogin/no-data-img.png" alt="">
          <p>No Data Available</p>
        </div>
      </ng-container>
      <!-- <div *ngIf="splitViewData.length == 0" style="text-align: center;">No details found</div> -->
    </div>
  </div>
  <ion-modal #filtermodal trigger="filtermodal-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">
              <ion-icon name="arrow-back" style="color: #ffffff;"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-title>Search</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="filterForm" (ngSubmit)="submitFilterForm(filterForm.value)">
          <div style="margin-top: 5px;">
            <div style="position: relative; left: 13px; font-size: 18px;">Booking ID</div>
            <ion-item class="mt-1" style="border: 2px solid green;margin: 0px 9px 0 10px;border-radius: 6px;">
              <ion-input type="text" placeholder="Booking ID" formControlName="bookingId"
                (keyup)="transformText($event)"></ion-input>
            </ion-item>
          </div>

          <ion-button type="submit" expand="block" style="margin: 20px 0px 0px 6px !important;
          width: 96% !important; --background: green !important;--background-activated: green !important;">Submit</ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
