<!-- <div class="background-img"></div> -->
<ion-content class="background-img">
  <div class="content">
    <ion-grid class="header-logo">
      <ion-row>
        <ion-col style="text-align: center;">
          <img src="../../../assets/beforelogin/Logo.svg" class="mt-3" width="40%" height="46%">
          <h1>e-bhaban</h1>
          <p>Home Department, Government of Odisha</p>
        </ion-col>
      </ion-row>
    </ion-grid>
    <form [formGroup]="createPasswordForm" (ngSubmit)="submitCreatePasswordForm(createPasswordForm.value)">
      <ion-card class="my-card">
        <ion-card-header class="my-cardheader">
          <ion-card-title class="my-cardtitle">Create Password</ion-card-title>
        </ion-card-header>

        <ion-card-content class="my-cardcontent">
          <div class="card-field">
            <ion-label class="label">OTP</ion-label>
            <ion-input placeholder="Enter OTP" type="text" clearInput="true" formControlName="otp"></ion-input>
            <span>(An OTP has been sent to your Mobile number and email id)</span>
            <div class="text-error text-danger"
              *ngIf="(createPasswordForm.controls.otp.touched || createPasswordForm.controls.otp.dirty) && createPasswordForm.controls.otp.invalid">
              <span class="text-danger" *ngIf="createPasswordForm.controls.otp.errors?.required">*This field is
                mandatory</span>
            </div>

            <ion-label class="label">Password</ion-label>
            <ion-input placeholder="Enter Password" type="password" clearInput="true"
              formControlName="password"></ion-input>
            <div class="text-error text-danger"
              *ngIf="(createPasswordForm.controls.password.touched || createPasswordForm.controls.password.dirty) && createPasswordForm.controls.password.invalid">
              <span class="text-danger" *ngIf="createPasswordForm.controls.password.errors?.required">*This field is
                mandatory</span>
            </div>

            <ion-label class="label">Confirm Password</ion-label>
            <ion-input placeholder="Enter Confirm Password" type="password" clearInput="true"
              formControlName="cpassword"></ion-input>
            <div class="text-error text-danger"
              *ngIf="(createPasswordForm.controls.cpassword.touched || createPasswordForm.controls.cpassword.dirty) && createPasswordForm.controls.cpassword.invalid">
              <span class="text-danger" *ngIf="createPasswordForm.controls.cpassword.errors?.required">*This field is
                mandatory</span>
            </div>
          </div>

          <ion-button type="submit" expand="block" [disabled]="createPasswordForm.invalid">Submit</ion-button>
          <ion-button type="button" expand="block" [disabled]="buttonName !='OTP Resend'"
            (click)="resendOTP()">{{buttonName}}</ion-button>

          <ion-label class="label" style="font-size: 14.33px;margin-top: 15px;" (click)="goToLoginPage('login')">Don’t have an account
            yet?&nbsp;<a>Login</a></ion-label>
        </ion-card-content>
      </ion-card>
    </form>
  </div>
</ion-content>
