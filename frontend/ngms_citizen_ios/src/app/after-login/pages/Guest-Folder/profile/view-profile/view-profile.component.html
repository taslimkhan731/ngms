<ion-content>
  <!-- <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title class="logo-text">Profile Details</ion-title>
  </ion-toolbar> -->
  <ion-header>
    <ion-toolbar >     
       <ion-buttons slot="start" slot="start" (click)="goBack()">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title> Profile Details</ion-title>
      </ion-toolbar>
      </ion-header>
      <ion-card class="my-card">
        <ion-card-header class="my-cardheader text-center">{{name}}</ion-card-header>
        <ion-card-content class="contentClass">
          <!-- <ion-row>
            <ion-col size="6">User ID  </ion-col>
            <ion-col  size="6">{{contactNo}}</ion-col>
          </ion-row> -->
          <!-- <ion-row>
            <ion-col size="6">Display Name</ion-col>
            <ion-col size="6">{{name}}</ion-col>
          </ion-row> -->
          <ion-row>
            <ion-col size="6">Mobile No </ion-col>
            <ion-col size="6">{{contactNo}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">Email Id</ion-col>
            <ion-col size="6">{{emailId}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">Address</ion-col>
            <ion-col size="6">{{residenceAddrs}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">Gender</ion-col>
            <ion-col size="6">{{gender}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">DOB</ion-col>
            <ion-col size="6">{{dob}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">Identity Proof</ion-col>
            <ion-col size="6">{{identyProof}}</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">Profile Document</ion-col>
            <ion-col size="6">{{docName}}</ion-col>
            <!-- <ion-col size="2"><a [href]="" target="_blank"> <ion-icon name="mail"></ion-icon></a></ion-col> -->
          </ion-row>
          <!-- <ion-row>
            <ion-col></ion-col>
            <ion-col style="display: flex;justify-content: flex-end;">
              <ion-button class="view-btn" (click)="goTo()" >View</ion-button>
            </ion-col>
          </ion-row> -->
        </ion-card-content>
        <!-- <ion-grid> -->
          <ion-row>
            <ion-col [size]="this.doc ? 10 : 12">
              <ion-button class="view-btn" fill="clear" expand="block" (click)="goTo()" >Edit Profile</ion-button>
            </ion-col>
            <ion-col size="2" *ngIf="this.doc">
              <ion-button class="view-btn" (click)="view()" ><ion-icon name="eye-outline"></ion-icon></ion-button>
            </ion-col>
            <ion-col [size]="12">
              <ion-button class="view-btn" fill="clear" expand="block" (click)="deleteAccount()" >Deactivate Account</ion-button>
            </ion-col>
          </ion-row>
        <!-- </ion-grid> -->
    
      </ion-card>
  <!-- </div> -->
</ion-content>
