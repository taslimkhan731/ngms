<ion-card>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-label class="lbl">Booking Id</ion-label>
        <ion-input type="text"></ion-input>
      </ion-col>
      <ion-col size="12">
        <ion-label class="lbl">Booking Date</ion-label>
        <ion-input type="text"></ion-input>
      </ion-col>
      <ion-col size="12">
        <ion-label class="lbl">Status</ion-label>
        <ion-input type="text"></ion-input>
      </ion-col>
    </ion-row>
    <ion-button expand="block" >Submit</ion-button>
  </ion-grid>
</ion-card>
