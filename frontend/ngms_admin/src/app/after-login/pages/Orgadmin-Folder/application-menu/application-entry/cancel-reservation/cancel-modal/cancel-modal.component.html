<ion-content class="cardContent">
  <ng-container>
  <ion-toolbar style="background-color: darkgreen;color: white;letter-spacing: 2px;font-size: 10px !important">
    <ion-buttons slot="start">
      <ion-icon name="chevron-back-outline" (click)="goBack()"></ion-icon>
    </ion-buttons>
    <ion-title>Cancel Reservation</ion-title>
  </ion-toolbar>
  <ion-card>
    <ion-card-content>
      <ng-container *ngIf="this.cancelType == 'cancel'">
        <ion-grid>
          <ion-row>
            <ion-col size="12">
              <ion-label class="lbl"> Booking ID </ion-label>
              <ion-input type="text" [(ngModel)]="bookingId" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">Name </ion-label>
              <ion-input type="text" [(ngModel)]="name" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">Mobile No </ion-label>
              <ion-input type="number" [(ngModel)]="mobileNo" readonly></ion-input>
            </ion-col>
            <input type="date" [max]="canFromMax" [min]="canFromMin" [(ngModel)]="CancelFrmDt" 
            (change)="changeDateFormat($any($event.target).value,'currDate');calculateDateDiffForCan()"
            #dateInput style="position:absolute;top:200%">
            <ion-col size="12">
              <ion-label class="lbl">Cancel Date </ion-label>
              <ion-row class="ion-align-items-center cs-input">
                <ion-col size="10" style="padding:0px !important" (click)="openDatepicker('dateInput')">
                  <ion-input type="text" placeholder="DD-MM-YYYY HH:mm" [value]="this.formatTime(this.CancelFrmDt) + ' 09:00'"
                    readonly></ion-input>
                </ion-col>
                <ion-col size="2" style="padding: 0px !important;">
                  <button type="button" class="datetime-button" (click)="openDatepicker('dateInput')"><ion-icon
                      style="font-size: 21px !important;" name="calendar" slot="end"></ion-icon>
                  </button>
                </ion-col>
              </ion-row>
              <!-- <ion-input type="date" [(ngModel)]="currDate" [max]="canFromMax" [min]="CancelFrmDt" (ionChange)="calculateDateDiffForPartialCan()"></ion-input> -->
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">To Date </ion-label>
              <ion-input type="text" [value]="CancelToDt  + ' 08:00'" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">No. of Days </ion-label>
              <ion-input type="text" [(ngModel)]="noOfDay" readonly></ion-input>
            </ion-col>
          
          </ion-row>
          <ion-row class="ion-justify-content-end my-2">
            <ion-button type="submit" (click)="goBack()" class="submitBtn" color="green">Back</ion-button>
            <ion-button type="submit" (click)="cancelBooking()" class="submitBtn" color="green">
              Submit</ion-button>
          </ion-row>
        </ion-grid>
      </ng-container>
      <ng-container *ngIf="this.cancelType == 'partialCan'">
        <ion-grid>
          <ion-row>
            <ion-col size="12">
              <ion-label class="lbl"> Booking ID </ion-label>
              <ion-input type="text" [(ngModel)]="bookingId" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">Name </ion-label>
              <ion-input type="text" [(ngModel)]="name" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">Mobile No </ion-label>
              <ion-input type="number" [(ngModel)]="mobileNo" readonly></ion-input>
            </ion-col>
            <input type="date" [max]="partianCanMax" [min]="partianCanMin" [(ngModel)]="currDate" 
            (change)="changeDateFormat($any($event.target).value,'currDate');calculateDateDiffForPartialCan()"
            #dateInput2 style="position:absolute;top:200%">
            <ion-col size="12">
              <ion-label class="lbl">Cancel Date </ion-label>
              <ion-row class="ion-align-items-center cs-input">
                <ion-col size="10" style="padding:0px !important" (click)="openDatepicker('dateInput2')">
                  <ion-input type="text" placeholder="DD-MM-YYYY HH:mm" [value]="this.formatTime(this.partianCanMin) + ' 09:00'"
                    readonly></ion-input>
                </ion-col>
                <ion-col size="2" style="padding: 0px !important;">
                  <button type="button" class="datetime-button" (click)="openDatepicker('dateInput2')"><ion-icon
                      style="font-size: 21px !important;" name="calendar" slot="end"></ion-icon>
                  </button>
                </ion-col>
              </ion-row>
              <!-- <ion-input type="date" [(ngModel)]="currDate" [max]="partianCanMax" [min]="partianCanMin" (ionChange)="calculateDateDiffForPartialCan()"></ion-input> -->
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">To Date </ion-label>
              <ion-input type="text" [value]="CancelToDt + '08:00'" readonly></ion-input>
            </ion-col>
            <ion-col size="12">
              <ion-label class="lbl">No. of Days </ion-label>
              <ion-input type="text" [(ngModel)]="noOfDay" readonly></ion-input>
            </ion-col>
          
          </ion-row>
          <ion-row class="ion-justify-content-end my-2">
            <ion-button type="submit" (click)="goBack()" class="submitBtn" color="green">Back</ion-button>
            <ion-button type="submit" (click)="partialCanBooking()" class="submitBtn" color="green">
              Submit</ion-button>
          </ion-row>
        </ion-grid>
      </ng-container>
    </ion-card-content>
  </ion-card>
  
  </ng-container>
</ion-content>
