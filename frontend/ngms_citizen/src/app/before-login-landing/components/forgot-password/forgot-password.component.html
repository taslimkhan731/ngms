<!-- <div class="background-img"></div> -->
<ion-content class="background-img">
    <div class="content">
        <ion-grid class="header-logo">
            <ion-row>
                <ion-col style="text-align: center;">
                    <img src="../../../assets/beforelogin/Logo.svg" class="mt-3" width="40%" height="46%">
                    <h3>e-bhawan</h3>
                    <p>Home Department, Government of Odisha</p>
                </ion-col>
            </ion-row>
        </ion-grid>
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="submitOtpForgotPassword(forgotPasswordForm.value)">
            <ion-card class="my-card">
                <ion-card-header class="my-cardheader">
                    <ion-card-title class="my-cardtitle">Forgot Password</ion-card-title>
                </ion-card-header>

                <ion-card-content class="my-cardcontent">
                    <!-- <div class="card-field"> -->
                    <!-- <ion-label class="label">User Type</ion-label>
                    <ion-input interface="action-sheet" placeholder="Guest" formControlName="userType" readonly> -->
                        <!-- <ion-select-option value="GUEST" selected>Guest</ion-select-option> -->
                    <!-- </ion-input> -->
                    <ion-label class="label required" style="margin-top:0px !important">Mobile No</ion-label>
                    <ion-input placeholder="Enter Mobile Number" type="text" clearInput="true" maxlength="10"
                        formControlName="mobile"></ion-input>
                    <div class="text-error text-danger"
                        *ngIf="((forgotPasswordForm.controls.mobile.touched || forgotPasswordForm.controls.mobile.dirty) && forgotPasswordForm.controls.mobile.invalid) || isSubmitBtnClicked == true">
                        <span class="text-danger" *ngIf="forgotPasswordForm.controls.mobile.errors?.required">*This
                            field is
                            mandatory</span>
                            <span class="text-danger"
                                *ngIf="forgotPasswordForm.controls.mobile.errors?.invalidMobileNumber">Enter valid mobile
                                number</span>
                    </div>

                    <!-- <ion-row class="captcha-div">
                    <ion-col size="9">
                        <img [src]="captchaURL" class="captchaImg" alt="Captcha Text">
                    </ion-col>
                    <ion-col size="3">
                        <ion-button (click)="getCaptcha()">
                            <ion-icon name="reload-outline"></ion-icon>
                        </ion-button>
                    </ion-col>
                </ion-row> -->
                    <div class="cd">
                        <ion-grid>
                            <ion-row>
                                <ion-col size="9">
                                    <img [src]="captchaURL" class="captchaImg" alt="Captcha Text">
                                </ion-col>
                                <ion-col size="3" class="mx-auto">
                                    <ion-button (click)="getCaptcha()" class="refresh">
                                        <ion-icon name="reload-outline" class="refresh" (click)="getCaptcha()"
                                            class="refresh"></ion-icon>
                                    </ion-button>
                                </ion-col>
                            </ion-row>
                        </ion-grid>
                    </div>
                    <ion-label class="label">Enter Captcha</ion-label>
                    <ion-input type="text" clearInput="true" placeholder="Enter Captcha"
                        formControlName="captcha"></ion-input>
                    <div class="text-error text-danger"
                        *ngIf="((forgotPasswordForm.controls.captcha.touched || forgotPasswordForm.controls.captcha.dirty) && forgotPasswordForm.controls.captcha.invalid) || isSubmitBtnClicked == true">
                        <span class="text-danger" *ngIf="forgotPasswordForm.controls.captcha.errors?.required">*This
                            field
                            is mandatory</span>
                    </div>
                    <ion-button type="submit" expand="block" style="margin-top: 12px;">Get OTP</ion-button>
                    <ion-label class="label" style="margin-top: 10px;font-size: 14.33px;"
                        (click)="goToLogin('login')">Don’t
                        have an account
                        yet?&nbsp;<a>Login</a></ion-label>
                </ion-card-content>
            </ion-card>
        </form>
    </div>
</ion-content>
