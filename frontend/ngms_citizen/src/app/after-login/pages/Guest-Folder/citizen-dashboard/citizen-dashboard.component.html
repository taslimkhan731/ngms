<ion-toolbar>
  <ion-buttons slot="start">
    <ion-menu-button></ion-menu-button>
  </ion-buttons>
  <ion-title class="logo-text">{{headerToolbar}}</ion-title>
  <!-- <ion-buttons slot="end" >
      <ion-icon  name="scan-outline">
      </ion-icon>
    </ion-buttons> -->
  <!-- <ion-buttons slot="end">
    <ion-icon name="notifications-outline"></ion-icon>
  </ion-buttons> -->
</ion-toolbar>
<ion-content>

  <div class="content">
    <ion-card class="my-card" *ngFor="let item of dashboard">
      <ion-card-header class="my-cardheader text-center">{{item.ghName}},{{item.cityName}}</ion-card-header>
      <ion-img [src]=item.support_document></ion-img>
      <ion-card-content class="my-cardcontent">
        <ion-grid class="gridClass">
          <ion-row>
            <ion-col size="1">
              <ion-icon name="location-outline"></ion-icon>
            </ion-col>
            <ion-col size="11">
              {{item.address}}
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="1">
              <ion-icon name="compass-outline"></ion-icon>
            </ion-col>
            <ion-col size="11">
              {{item.address_details}}
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="1">
              <ion-icon name="call-outline"></ion-icon>
            </ion-col>
            <ion-col size="11">
              {{item.contact_num}}
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="1">
              <ion-icon name="mail-outline"></ion-icon>
            </ion-col>
            <ion-col size="11">
              {{item.emailId}}
            </ion-col>
          </ion-row>
        </ion-grid>

        <ion-grid>
          <ion-row>
            <ion-col size="12">
              <ion-button expand="block" shape="round" class="booking-btn" (click)="goToBooking(item)">Book
                Now</ion-button>
            </ion-col>
            <!-- <ion-col size="2">
              <div class="heart-icon">
                <ion-icon name="heart"></ion-icon>
              </div>
            </ion-col> -->
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
